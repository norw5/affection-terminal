<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AFFECTION Terminal — a decentralized, client-side portal for the AFFECTION (A) token ecosystem on PulseChain."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>AFF_TERMINAL — AFFECTION Ecosystem Portal</title>
    <style>
      /* Pre-hydration boot splash (cleared on mount). Inline so it shows instantly. */
      html, body { margin: 0; height: 100%; background: #0b0c0e; color: #cdd0d6; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        justify-content: center; align-items: flex-start; gap: 0.25rem;
        padding: 2rem; box-sizing: border-box; font-size: 0.8rem; line-height: 1.25rem;
      }
      #boot .a { color: #c9a86a; }
      #boot .d { color: #5b5f68; }
      .cursor { display: inline-block; width: 0.55rem; height: 1rem; background: #c9a86a;
        vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div><span class="a">AFF_TERMINAL</span><span class="cursor"></span></div>
      <div class="d">initializing decentralized state machine...</div>
      <div class="d">loading modules</div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="color:#cdd0d6;font-family:monospace;padding:2rem">
        AFF_TERMINAL requires JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
